<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BrewDash - Alcohol Delivery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo { font-size: 2.5rem; margin-bottom: 10px; }
    h2 { color: #fff; font-size: 1.8rem; margin-bottom: 5px; }
    .subtitle { color: #aaa; margin-bottom: 25px; font-size: 0.9rem; }
    .form-box { display: flex; flex-direction: column; gap: 15px; }
    input {
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }
    input::placeholder { color: #aaa; }
    input:focus { border-color: #e94560; }
    button {
      padding: 14px;
      background: linear-gradient(135deg, #e94560, #c62a47);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
    }
    .switch { color: #aaa; font-size: 0.9rem; }
    .switch a { color: #e94560; cursor: pointer; font-weight: bold; }
    .hidden { display: none !important; }
    .message { padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-top: 5px; }
    .success { background: rgba(0, 200, 100, 0.2); color: #00c864; }
    .error { background: rgba(233, 69, 96, 0.2); color: #e94560; }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div class="container" id="loginPage">
    <div class="logo">🍺 BrewDash</div>
    <h2>Welcome Back!</h2>
    <p class="subtitle">Deliver happiness to your door</p>
    <div class="form-box">
      <input type="text" id="loginPhone" placeholder="📱 Phone Number" />
      <input type="password" id="loginPassword" placeholder="🔒 Password" />
      <button onclick="login()">Login</button>
      <p class="switch">Don't have an account? <a onclick="showRegister()">Register here</a></p>
    </div>
  </div>

  <!-- Register Page -->
  <div class="container hidden" id="registerPage">
    <div class="logo">🍺 BrewDash</div>
    <h2>Create Account</h2>
    <p class="subtitle">Join us for fast delivery!</p>
    <div class="form-box">
      <input type="text" id="regName" placeholder="👤 Full Name" />
      <input type="text" id="regPhone" placeholder="📱 Phone Number" />
      <input type="password" id="regPassword" placeholder="🔒 Password" />
      <input type="text" id="regAddress" placeholder="🏠 Delivery Address" />
      <button onclick="register()">Register</button>
      <p class="switch">Already have an account? <a onclick="showLogin()">Login here</a></p>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('registerPage').classList.remove('hidden');
    }
    function showLogin() {
      document.getElementById('registerPage').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
    }
    async function register() {
      const name = document.getElementById('regName').value;
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPassword').value;
      const address = document.getElementById('regAddress').value;
      if (!name || !phone || !password || !address) {
        showMessage('registerPage', 'Please fill all fields!', 'error');
        return;
      }
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, password, address })
        });
        const data = await res.json();
        if (res.ok) {
          showMessage('registerPage', data.message, 'success');
          setTimeout(showLogin, 1500);
        } else {
          showMessage('registerPage', data.message, 'error');
        }
      } catch (err) {
        showMessage('registerPage', 'Server error!', 'error');
      }
    }
    async function login() {
      const phone = document.getElementById('loginPhone').value;
      const password = document.getElementById('loginPassword').value;
      if (!phone || !password) {
        showMessage('loginPage', 'Please fill all fields!', 'error');
        return;
      }
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('loginPage', data.message, 'success');
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else if (data.user.role === 'delivery') {
              window.location.href = '/delivery.html';
            } else {
              window.location.href = '/shop.html';
            }
          }, 1000);
        } else {
          showMessage('loginPage', data.message, 'error');
        }
      } catch (err) {
        showMessage('loginPage', 'Server error!', 'error');
      }
    }
    function showMessage(pageId, message, type) {
      const existing = document.querySelector('.message');
      if (existing) existing.remove();
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = message;
      document.getElementById(pageId).querySelector('.form-box').appendChild(div);
      setTimeout(() => div.remove(), 3000);
    }
  </script>

</body>
</html>
